<!DOCTYPE html>
<html>
<head>
    <title>Greeting Card Creator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(function () {

            $("#applyBtn").on("click", function () {

                var bg = $("#colorSelect").val();
                var family = $("#fontSelect").val();
                var size = $("#fontSize").val() || 26;
                var borderType = $("input[name='frame']:checked").val();
                var showImg = $("#showImage").prop("checked");
                var message = $("#msg").val();

                $("#cardPreview").css({
                    backgroundColor: bg,
                    fontFamily: family,
                    fontSize: size + "px",
                    border: borderType === "none" ? "none" : "6px " + borderType + " black"
                });

                if (message.trim() !== "") {
                    $("#cardText").text(message);
                } else {
                    $("#cardText").text("Warm Wishes To You!");
                }

                if (showImg) {
                    $("#cardImg").slideDown();
                } else {
                    $("#cardImg").slideUp();
                }
            });

        });
    </script>
</head>

<body style="margin:0; height:100vh; font-family:Arial;">

<div style="display:flex; height:100%;">

    <!-- LEFT PANEL -->
    <div style="width:35%; padding:25px; background:#eaeaea; border-right:2px solid #bbb; overflow-y:auto;">

        <h2 style="margin-top:0;">Customize Card</h2>

        <label>Choose Background:</label><br>
        <select id="colorSelect" style="width:100%; padding:5px;">
            <option value="lightyellow">Yellow</option>
            <option value="lightpink">Pink</option>
            <option value="lightgreen">Green</option>
            <option value="lightblue">Blue</option>
        </select><br><br>

        <label>Select Font:</label><br>
        <select id="fontSelect" style="width:100%; padding:5px;">
            <option>Georgia</option>
            <option>Verdana</option>
            <option>Tahoma</option>
            <option>Courier New</option>
        </select><br><br>

        <label>Font Size (px):</label><br>
        <input type="text" id="fontSize" placeholder="Example: 28"
               style="width:100%; padding:5px;"><br><br>

        <label>Border Style:</label><br>
        <input type="radio" name="frame" value="none" checked> None<br>
        <input type="radio" name="frame" value="solid"> Solid<br>
        <input type="radio" name="frame" value="double"> Double<br><br>

        <input type="checkbox" id="showImage"> Include Image<br><br>

        <label>Message:</label><br>
        <textarea id="msg" rows="3" style="width:100%; padding:6px;"></textarea><br><br>

        <button id="applyBtn"
                style="padding:10px 15px; background:#0066cc; color:white; border:none; cursor:pointer;">
            Generate Card
        </button>

    </div>

    <!-- RIGHT PANEL -->
    <div id="cardPreview"
         style="width:65%; display:flex; flex-direction:column; align-items:center;
                justify-content:center; text-align:center; transition:0.3s;">

        <p id="cardText">Warm Wishes To You!</p>
