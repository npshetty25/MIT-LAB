<!DOCTYPE html>
<html lang="en">
<head>
<title>Student Bio-Data Form</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #e0eafc, #cfdef3);
    font-family: 'Poppins', sans-serif;
}

.form-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
}

h2 {
    color: #2c3e50;
    font-weight: bold;
}

.table td {
    vertical-align: middle;
}

label {
    font-weight: 500;
    color: #34495e;
}

input, textarea {
    border-radius: 8px !important;
}

.btn-success {
    background-color: #1abc9c;
    border: none;
}

.btn-danger {
    background-color: #e74c3c;
    border: none;
}
</style>

<!-- JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</head>

<body>

<div class="container mt-5">
<div class="form-card">

<h2 class="text-center mb-4">Student Bio-Data Form</h2>

<form>
<table class="table table-bordered table-hover">

<tr>
<td><label>Student Name</label></td>
<td><input type="text" class="form-control" placeholder="Enter name"></td>
</tr>

<tr>
<td><label>Roll Number</label></td>
<td><input type="text" class="form-control" placeholder="Enter roll number"></td>
</tr>

<tr>
<td><label>Email</label></td>
<td><input type="email" class="form-control" placeholder="Enter email"></td>
</tr>

<tr>
<td><label>Gender</label></td>
<td>
<div class="custom-control custom-radio custom-control-inline">
<input type="radio" class="custom-control-input" id="male" name="gender">
<label class="custom-control-label" for="male">Male</label>
</div>

<div class="custom-control custom-radio custom-control-inline">
<input type="radio" class="custom-control-input" id="female" name="gender">
<label class="custom-control-label" for="female">Female</label>
</div>
</td>
</tr>

<tr>
<td><label>Hobbies</label></td>
<td>
<div class="custom-control custom-checkbox">
<input type="checkbox" class="custom-control-input" id="reading">
<label class="custom-control-label" for="reading">Reading</label>
</div>

<div class="custom-control custom-checkbox">
<input type="checkbox" class="custom-control-input" id="sports">
<label class="custom-control-label" for="sports">Sports</label>
</div>

<div class="custom-control custom-checkbox">
<input type="checkbox" class="custom-control-input" id="music">
<label class="custom-control-label" for="music">Music</label>
</div>
</td>
</tr>

<tr>
<td><label>Address</label></td>
<td><textarea class="form-control" rows="3"></textarea></td>
</tr>

<tr>
<td colspan="2" class="text-center">
<button type="submit" class="btn btn-success px-4">Submit</button>
<button type="reset" class="btn btn-danger px-4 ml-2">Reset</button>
</td>
</tr>

</table>
</form>

</div>
</div>

</body>
</html>
